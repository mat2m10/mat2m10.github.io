<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matthieu's Toolbox</title>
  <meta name="description" content="Robotics, perception and AI toolbox of Matthieu de Hemptinne. Click a tool to open the repo that uses it.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Matthieu de Hemptinne · toolbox</h1>
    <p>Robotics &amp; AI engineer. Hover a tool for where I used it; tools with a green dot open the GitHub repo that uses them.</p>
  </header>

  <div class="frame">
    <div id="wrap">
      <div id="stage">
        <svg id="links" aria-hidden="true">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="#2b4c6b"></path>
            </marker>
          </defs>
        </svg>
        <div class="label">current toolbox</div>
      </div>
    </div>
  </div>

  <footer>
    <p>Plain HTML, CSS and JavaScript, no framework · <a href="https://github.com/mat2m10/mat2m10.github.io">source</a> ·
      <a href="https://www.linkedin.com/in/mat2m10/">LinkedIn</a> · <a href="https://smarttinmen.com">Smart Tinmen</a></p>
  </footer>

  <div id="tip" role="tooltip"></div>
  <script src="toolbox.js"></script>
</body>
</html>
